name: Build AAP ServiceNow Execution Environment
# Execution Environment Build

on:
  push:
    branches:
      - main
    paths:
      - "AAP-ServiceNow/**"
      - ".github/workflows/build-ee-servicenow.yml"
  workflow_dispatch:

jobs:
  build-ee:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible Builder
        run: |
          python -m pip install --upgrade pip
          pip install ansible-builder

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Log in to Red Hat Registry
        uses: redhat-actions/podman-login@v1
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      - name: Build Execution Environment
        run: |
          ansible-builder build \
            --file AAP-ServiceNow/execution_environment/execution_environment.yml \
            --tag ghcr.io/bluehatlab/aap-servicenow-ee:latest

      - name: Verify image exists
        run: |
          podman images

      - name: Push Execution Environment
        run: |
          podman push ghcr.io/bluehatlab/aap-servicenow-ee:latest