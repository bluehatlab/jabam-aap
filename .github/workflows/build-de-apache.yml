
name: Build AAP Apache Decision Environment

on:
  push:
    branches:
      - main
    paths:
      - "EDA-Decision-Environments/**"
      - ".github/workflows/build-de-apache.yml"

  workflow_dispatch:

jobs:
  build-de:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Inspect the actual GitHub checkout
      - name: Inspect checked-out repository
        run: |
          echo "Current branch or ref:"
          echo "$GITHUB_REF"

          echo "Commit being built:"
          git rev-parse HEAD

          echo "Repository root:"
          pwd

          echo "Root directory contents:"
          ls -la

          echo "Tracked EDA files:"
          git ls-files | grep -i 'eda-decision' || true

          echo "Matching directories:"
          find . -maxdepth 3 -type d -iname '*decision*'

      # 3. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 4. Install Ansible Builder
      - name: Install Ansible Builder
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-builder

      # 5. Authenticate to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 6. Authenticate to Red Hat Registry
      - name: Log in to Red Hat Registry
        uses: docker/login-action@v3
        with:
          registry: registry.redhat.io
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_PASSWORD }}

      # 7. Verify the DE definition exists
      - name: Verify Decision Environment definition
        run: |
          echo "Checking DE directory:"
          ls -la EDA-Decision-Environments/

          echo "Checking definition file:"
          test -f EDA-Decision-Environments/execution-environment.yml

          echo "Definition found successfully."

      # 8. Build the Decision Environment
      - name: Build Decision Environment
        working-directory: EDA-Decision-Environments
        run: |
          ansible-builder build \
            --container-runtime docker \
            --file execution-environment.yml \
            --tag ghcr.io/bluehatlab/apache-eda-de:latest


      - name: Verify Decision Environment image
        run: |
          echo "Installed EDA collections:"
          docker run --rm \
            ghcr.io/bluehatlab/apache-eda-de:latest \
            ansible-galaxy collection list

          echo "Checking community.eda event sources:"
          docker run --rm \
            --entrypoint /bin/sh \
            ghcr.io/bluehatlab/apache-eda-de:latest \
            -c 'find /usr/share/ansible/collections/ansible_collections/community/eda -type f -path "*/plugins/event_source/*" -print'

          echo "Checking for url_check:"
          docker run --rm \
            --entrypoint /bin/sh \
            ghcr.io/bluehatlab/apache-eda-de:latest \
            -c 'find /usr/share/ansible/collections/ansible_collections/community/eda -name "*url_check*" -print'


