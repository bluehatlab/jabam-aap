---
- name: Configure Windows
  hosts: windows
  gather_facts: true

  become: true
  become_method: runas
  become_user: Administrator

  tasks:

    - name: Show hostname
      ansible.builtin.debug:
        var: ansible_hostname

    - name: Show operating system
      ansible.builtin.debug:
        var: ansible_distribution
   
    - name: Show Ansible Windows user
      ansible.windows.win_whoami:
      register: windows_identity

    - name: Display Windows identity
      ansible.builtin.debug:
        var: windows_identity

    - name: Test PowerShell process creation
      ansible.windows.win_shell: |
        $p = Start-Process -FilePath "cmd.exe" -ArgumentList "/c echo PROCESS_TEST" -Wait -PassThru
        Write-Output "ExitCode: $($p.ExitCode)"
      args:
        executable: powershell.exe    

    - name: Check whether Chocolatey is installed
      ansible.windows.win_command: choco --version
      register: choco_version
      changed_when: false

    - name: Display Chocolatey version
      ansible.builtin.debug:
        var: choco_version.stdout

    - name: List installed Chocolatey packages
      ansible.windows.win_command: choco list --local-only
      register: choco_packages
      changed_when: false

    - name: Display installed Chocolatey packages
      ansible.builtin.debug:
        var: choco_packages.stdout

    - name: Install Apache
      chocolatey.chocolatey.win_chocolatey:
        name: apache-httpd
        state: present

    - name: Start Apache
      ansible.windows.win_service:
        name: Apache2.4
        state: started
        start_mode: auto

    - name: Verify Apache service
      ansible.windows.win_service:
        name: Apache2.4
      register: apache_service

    - name: Get EC2 metadata token
      ansible.builtin.uri:
        url: http://169.254.169.254/latest/api/token
        method: PUT
        headers:
          X-aws-ec2-metadata-token-ttl-seconds: "21600"
        return_content: true
      register: ec2_metadata_token

    - name: Get EC2 public IPv4
      ansible.builtin.uri:
        url: http://169.254.169.254/latest/meta-data/public-ipv4
        method: GET
        headers:
          X-aws-ec2-metadata-token: "{{ ec2_metadata_token.content }}"
        return_content: true
      register: ec2_public_ip

    - name: Display server information
      ansible.builtin.debug:
        msg:
          - "OS: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - "Hostname: {{ ansible_hostname }}"
          - "Private IP: {{ ansible_default_ipv4.address }}"
          - "Public IPv4: {{ ec2_public_ip.content }}"
          - "Apache: {{ apache_service.state }}"