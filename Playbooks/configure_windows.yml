---
- name: Configure Windows Compute
  hosts: windows
  gather_facts: true

  tasks:

    # ---------------------------------------------------------
    # 1. Verify Windows connectivity / identity
    # ---------------------------------------------------------

    - name: Verify WinRM connectivity
      ansible.windows.win_ping:

    - name: Show hostname
      ansible.builtin.debug:
        var: ansible_hostname

    - name: Show operating system
      ansible.builtin.debug:
        msg:
          - "OS: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"

    - name: Show Ansible Windows user
      ansible.windows.win_whoami:
      register: windows_identity

    - name: Display Windows identity
      ansible.builtin.debug:
        var: windows_identity.account.account_name


    # ---------------------------------------------------------
    # 2. Install package management
    # ---------------------------------------------------------

    - name: Ensure Chocolatey is installed
      chocolatey.chocolatey.win_chocolatey:
        name: chocolatey
        state: present

    - name: Get Chocolatey version
      ansible.windows.win_command: choco --version
      register: choco_version
      changed_when: false

    - name: Display Chocolatey version
      ansible.builtin.debug:
        var: choco_version.stdout


    # ---------------------------------------------------------
    # 3. Configure application
    # ---------------------------------------------------------

    - name: Ensure Apache is installed
      chocolatey.chocolatey.win_chocolatey:
        name: apache-httpd
        state: present

    - name: Ensure Apache is running and enabled
      ansible.windows.win_service:
        name: Apache
        state: started
        start_mode: auto

    - name: Get Apache service information
      ansible.windows.win_service:
        name: Apache
      register: apache_service


    # ---------------------------------------------------------
    # 4. Get Windows networking information
    # ---------------------------------------------------------

    - name: Get private IPv4 address
      ansible.windows.win_shell: |
        Get-NetIPAddress -AddressFamily IPv4 |
          Where-Object {
            $_.IPAddress -notlike '127.*' -and
            $_.IPAddress -notlike '169.254.*'
          } |
          Select-Object -First 1 -ExpandProperty IPAddress
      register: private_ip
      changed_when: false

    - name: Get EC2 IMDSv2 token
      ansible.windows.win_uri:
        url: http://169.254.169.254/latest/api/token
        method: PUT
        headers:
          X-aws-ec2-metadata-token-ttl-seconds: "21600"
        return_content: true
      register: metadata_token

    - name: Get EC2 public IPv4 address
      ansible.windows.win_uri:
        url: http://169.254.169.254/latest/meta-data/public-ipv4
        method: GET
        headers:
          X-aws-ec2-metadata-token: "{{ metadata_token.content }}"
        return_content: true
      register: public_ip


    # ---------------------------------------------------------
    # 5. Display final desired state
    # ---------------------------------------------------------

    - name: Display Windows server information
      ansible.builtin.debug:
        msg:
          - "OS: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - "Hostname: {{ ansible_hostname }}"
          - "Private IPv4: {{ private_ip.stdout | trim }}"
          - "Public IPv4: {{ public_ip.content | trim }}"
          - "Chocolatey: {{ choco_version.stdout | trim }}"
          - "Apache: {{ apache_service.state }}"