
---
- name: RHEL Apache automatic remediation
  hosts: all

  sources:
    - community.eda.url_check:
        urls:
          - http://3.80.122.153/
        delay: 15

  rules:
    - name: Apache service failure detected
      condition: event.url_check.status == "down"

      action:
        run_workflow_template:
          name: "EDA - RHEL ServiceNow Remediation"
          organization: "JULIAN"
