---
- name: Test ServiceNow connection
  hosts: localhost
  gather_facts: false

  vars:
    sn_host: "{{ lookup('env', 'SN_HOST') }}"
    sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
    sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"

  tasks:
    - name: Query ServiceNow incidents
      servicenow.itsm.incident_info:
        instance:
          host: "{{ sn_host }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
      register: incidents

    - name: Display incident count
      ansible.builtin.debug:
        msg: "ServiceNow returned {{ incidents.records | length }} incidents"