
---
- name: Resolve existing ServiceNow incident
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    sn_host: "{{ lookup('env', 'SN_HOST') }}"
    sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
    sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"

  tasks:
    - name: Verify incident identifier was received
      ansible.builtin.assert:
        that:
          - servicenow_incident_sys_id is defined
          - servicenow_incident_sys_id | length > 0
        fail_msg: "Missing original incident sys_id from workflow."

    - name: Resolve original ServiceNow incident
      servicenow.itsm.incident:
        instance:
          host: "{{ sn_host }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"

        sys_id: "{{ servicenow_incident_sys_id }}"
        state: resolved

        close_code: "Solved (Permanently)"
        close_notes: >-
          Apache service successfully restored through
          Red Hat Ansible Automation Platform.
          HTTP connectivity verified following remediation.

      register: servicenow_resolution
      no_log: true

    - name: Display resolved incident
      ansible.builtin.debug:
        msg:
          - "Incident: {{ servicenow_resolution.record.number }}"
          - "State: {{ servicenow_resolution.record.state }}"
          - "Resolution completed successfully"
