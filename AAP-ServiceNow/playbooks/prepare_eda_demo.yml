---
- name: Prepare RHEL web service for EDA demo
  hosts: ec2-98-89-5-15.compute-1.amazonaws.com
  gather_facts: false
  become: true

  tasks:
    - name: Install Apache
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Enable and start Apache
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true

    - name: Create demo web page
      ansible.builtin.copy:
        dest: /var/www/html/index.html
        content: |
          RHEL 10 - Managed by Ansible Automation Platform
        mode: "0644"

    - name: Verify Apache responds
      ansible.builtin.uri:
        url: http://localhost
        status_code: 200

    - name: Report success
      ansible.builtin.debug:
        msg: "Apache is running and responding with HTTP 200."