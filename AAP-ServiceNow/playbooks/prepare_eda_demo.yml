---
- name: Prepare RHEL web service for EDA demo
  hosts: ec2-98-89-5-15.compute-1.amazonaws.com
  gather_facts: false
  become: true

  tasks:

    - name: Install Apache
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Enable and start Apache
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true
      register: httpd_start
      failed_when: false

    - name: Get Apache service status
      ansible.builtin.command:
        cmd: systemctl status httpd --no-pager -l
      register: httpd_status
      changed_when: false
      failed_when: false

    - name: Get recent Apache logs
      ansible.builtin.command:
        cmd: journalctl -u httpd --no-pager -n 30
      register: httpd_logs
      changed_when: false
      failed_when: false

    - name: Display Apache status
      ansible.builtin.debug:
        var: httpd_status.stdout_lines

    - name: Display Apache logs
      ansible.builtin.debug:
        var: httpd_logs.stdout_lines

    - name: Get Apache failure logs
      ansible.builtin.shell: |
        journalctl -u httpd --since "2 minutes ago" --no-pager
      register: httpd_failure_logs
      changed_when: false
      failed_when: false

    - name: Display Apache failure logs
      ansible.builtin.debug:
        msg: "{{ httpd_failure_logs.stdout }}"