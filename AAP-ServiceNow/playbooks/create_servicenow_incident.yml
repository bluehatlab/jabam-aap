
---
- name: Create ServiceNow incident from AAP
  hosts: all
  gather_facts: false

  vars:
    sn_host: "{{ lookup('env', 'SN_HOST') }}"
    sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
    sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"

  tasks:
    - name: Create ServiceNow incident
      servicenow.itsm.incident:
        instance:
          host: "{{ sn_host }}"
          username: "{{ sn_username }}"
          password: "{{ sn_password }}"
        state: new
        caller: "{{ sn_username }}"
        short_description: "Apache service failure detected on RHEL"
        description: >-
          Event-Driven Ansible detected an Apache service failure
          on the RHEL host. An automated remediation workflow
          has been initiated by Red Hat Ansible Automation Platform.
        impact: medium
        urgency: medium
      register: servicenow_incident
      no_log: false

    - name: Display created incident
      ansible.builtin.debug:
        msg:
          - "Incident Number: {{ servicenow_incident.record.number }}"
          - "Caller: {{ sn_username }}"
          - "State: {{ servicenow_incident.record.state }}"

    - name: Publish incident for workflow
      ansible.builtin.set_stats:
        data:
          servicenow_incident_number: "{{ servicenow_incident.record.number }}"
          servicenow_incident_sys_id: "{{ servicenow_incident.record.sys_id }}"
