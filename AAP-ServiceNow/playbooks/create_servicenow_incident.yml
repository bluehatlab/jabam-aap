---
- name: Create ServiceNow incident from AAP
  hosts: localhost
  gather_facts: false

  vars:
    sn_host: "{{ lookup('env', 'SN_HOST') }}"
    sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
    sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"

  tasks:

    - name: Create incident in ServiceNow
      ansible.builtin.uri:
        url: "{{ sn_host }}/api/now/table/incident"
        method: POST

        user: "{{ sn_username }}"
        password: "{{ sn_password }}"
        force_basic_auth: true

        headers:
          Accept: "application/json"
          Content-Type: "application/json"

        body_format: json

        body:
          short_description: "Apache service failure detected on RHEL"
          description: >-
            Event-Driven Ansible detected an Apache service failure
            on the RHEL host. An automated remediation workflow
            has been initiated by Red Hat Ansible Automation Platform.
          impact: "2"
          urgency: "2"

        status_code: 201
        return_content: true

      register: servicenow_incident

    - name: Display created incident
      ansible.builtin.debug:
        msg:
          - "Incident created successfully"
          - "Number: {{ servicenow_incident.json.result.number }}"
          - "Sys ID: {{ servicenow_incident.json.result.sys_id }}"
          - "State: {{ servicenow_incident.json.result.state }}"

    - name: Publish ServiceNow incident for workflow
      ansible.builtin.set_stats:
        data:
          servicenow_incident_number: "{{ servicenow_incident.json.result.number }}"
          servicenow_incident_sys_id: "{{ servicenow_incident.json.result.sys_id }}"