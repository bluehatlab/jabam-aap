
---
- name: Prepare Windows web service for EDA demo
  hosts: all
  gather_facts: false

  tasks:

    - name: Install IIS
      ansible.windows.win_feature:
        name: Web-Server
        state: present
        include_management_tools: true

    - name: Ensure IIS document root exists
      ansible.windows.win_file:
        path: C:\inetpub\wwwroot
        state: directory

    - name: Create demo web page
      ansible.windows.win_copy:
        dest: C:\inetpub\wwwroot\index.html
        content: |
          Windows Server 2022 - Managed by Ansible Automation Platform

    - name: Enable and start IIS
      ansible.windows.win_service:
        name: W3SVC
        state: started
        start_mode: auto

    - name: Verify IIS responds
      ansible.windows.win_uri:
        url: http://localhost/
        status_code: 200
      register: web_check

    - name: Report preparation result
      ansible.builtin.debug:
        msg: "IIS is running and responding with HTTP {{ web_check.status_code }}."
