---
- name: Configure Windows scheduled maintenance
  hosts: windows
  gather_facts: false

  tasks:
    - name: Deploy PowerShell maintenance script
      ansible.windows.win_copy:
        content: |
          Get-Service |
          Where-Object {$_.Status -eq "Stopped"} |
          Out-File C:\maintenance-report.txt
        dest: C:\maintenance.ps1

    - name: Create scheduled task
      ansible.windows.win_scheduled_task:
        name: AAP-Maintenance
        description: "Automated maintenance deployed by AAP"

        actions:
          - path: powershell.exe
            arguments: '-ExecutionPolicy Bypass -File C:\maintenance.ps1'

        triggers:
          - type: daily
            start_boundary: '2026-10-06T23:00:00'

        username: SYSTEM
        run_level: highest
        state: present
        enabled: true