---
- name: Reset RHEL VM for EDA ServiceNow demo
  hosts: ec2-98-89-5-15.compute-1.amazonaws.com
  gather_facts: false
  become: true

  tasks:
    - name: Ensure Apache is installed
      ansible.builtin.dnf:
        name: httpd
        state: present

    - name: Reset Apache to running state
      ansible.builtin.systemd:
        name: httpd
        state: started
        enabled: true

    - name: Verify Apache is running
      ansible.builtin.command:
        cmd: systemctl is-active httpd
      register: httpd_status
      changed_when: false
      failed_when: httpd_status.stdout != "active"

    - name: Display reset confirmation
      ansible.builtin.debug:
        msg: "EDA Demo Reset Complete - Apache status: {{ httpd_status.stdout }}"