---
# ============================================================
# COMPUTE FLEET COMPLIANCE ASSESSMENT
#
# Platforms:
#   1. Red Hat Enterprise Linux
#   2. Amazon Linux
#   3. Windows Server
#
# Purpose:
# Detect security and operational configuration drift across
# the heterogeneous compute fleet.
#
# Assessment only — no remediation occurs in this playbook.
# ============================================================


# ============================================================
# RHEL + AMAZON LINUX COMPLIANCE ASSESSMENT
# ============================================================

- name: Assess RHEL and Amazon Linux Compliance
  hosts: rhel:amazon_linux
  become: true
  gather_facts: true

  tasks:

    # --------------------------------------------------------
    # Linux Control 1 - Secure Remote Access
    # --------------------------------------------------------

    - name: "[LINUX] Check SSH root login policy"
      ansible.builtin.shell: |
        sshd -T | grep '^permitrootlogin'
      register: ssh_root_policy
      changed_when: false
      failed_when: false

    - name: "[LINUX] Evaluate SSH root login compliance"
      ansible.builtin.set_fact:
        ssh_root_compliant: >-
          {{
            'permitrootlogin no'
            in (ssh_root_policy.stdout | lower)
          }}


    # --------------------------------------------------------
    # Linux Control 2 - Host Firewall
    # --------------------------------------------------------

    - name: "[LINUX] Gather service state"
      ansible.builtin.service_facts:

    - name: "[LINUX] Evaluate firewall compliance"
      ansible.builtin.set_fact:
        firewall_compliant: >-
          {{
            'firewalld.service' in ansible_facts.services
            and
            ansible_facts.services['firewalld.service'].state == 'running'
          }}


    # --------------------------------------------------------
    # Linux Control 3 - Time Synchronization
    # --------------------------------------------------------

    - name: "[LINUX] Evaluate time synchronization compliance"
      ansible.builtin.set_fact:
        chrony_compliant: >-
          {{
            'chronyd.service' in ansible_facts.services
            and
            ansible_facts.services['chronyd.service'].state == 'running'
          }}


    # --------------------------------------------------------
    # Linux Compliance Result
    # --------------------------------------------------------

    - name: "[LINUX] Calculate overall compliance"
      ansible.builtin.set_fact:
        compute_compliant: >-
          {{
            ssh_root_compliant
            and firewall_compliant
            and chrony_compliant
          }}

    - name: "[LINUX] Display compliance assessment"
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "LINUX COMPUTE COMPLIANCE"
          - "============================================"
          - "Host: {{ inventory_hostname }}"
          - "Platform: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - ""
          - "Secure Remote Access: {{ 'PASS' if ssh_root_compliant else 'FAIL' }}"
          - "Host Firewall: {{ 'PASS' if firewall_compliant else 'FAIL' }}"
          - "Time Synchronization: {{ 'PASS' if chrony_compliant else 'FAIL' }}"
          - ""
          - "OVERALL: {{ 'COMPLIANT' if compute_compliant else 'NON-COMPLIANT' }}"
          - "============================================"


# ============================================================
# WINDOWS SERVER COMPLIANCE ASSESSMENT
# ============================================================

- name: Assess Windows Server Compliance
  hosts: windows
  gather_facts: true

  tasks:

    # --------------------------------------------------------
    # Windows Control 1 - Host Firewall
    # --------------------------------------------------------

    - name: "[WINDOWS] Check Windows Firewall profiles"
      ansible.windows.win_shell: |
        $profiles = Get-NetFirewallProfile

        if (($profiles | Where-Object { $_.Enabled -eq $false }).Count -eq 0) {
            Write-Output "COMPLIANT"
        }
        else {
            Write-Output "NON_COMPLIANT"
        }
      register: windows_firewall
      changed_when: false

    - name: "[WINDOWS] Evaluate firewall compliance"
      ansible.builtin.set_fact:
        windows_firewall_compliant: >-
          {{
            'COMPLIANT' in windows_firewall.stdout
            and
            'NON_COMPLIANT' not in windows_firewall.stdout
          }}


    # --------------------------------------------------------
    # Windows Control 2 - Update Readiness
    # --------------------------------------------------------

    - name: "[WINDOWS] Check Windows Update service"
      ansible.windows.win_shell: |
        $service = Get-CimInstance Win32_Service -Filter "Name='wuauserv'"

        if ($service.StartMode -eq "Disabled") {
            Write-Output "NON_COMPLIANT"
        }
        else {
            Write-Output "COMPLIANT"
        }
      register: windows_update
      changed_when: false

    - name: "[WINDOWS] Evaluate Windows Update compliance"
      ansible.builtin.set_fact:
        windows_update_compliant: >-
          {{
            'COMPLIANT' in windows_update.stdout
            and
            'NON_COMPLIANT' not in windows_update.stdout
          }}


    # --------------------------------------------------------
    # Windows Control 3 - Secure Remote Access
    # --------------------------------------------------------

    - name: "[WINDOWS] Check RDP Network Level Authentication"
      ansible.windows.win_shell: |
        $value = (Get-ItemProperty `
          -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
          -Name UserAuthentication).UserAuthentication

        if ($value -eq 1) {
            Write-Output "COMPLIANT"
        }
        else {
            Write-Output "NON_COMPLIANT"
        }
      register: windows_nla
      changed_when: false

    - name: "[WINDOWS] Evaluate NLA compliance"
      ansible.builtin.set_fact:
        windows_nla_compliant: >-
          {{
            'COMPLIANT' in windows_nla.stdout
            and
            'NON_COMPLIANT' not in windows_nla.stdout
          }}


    # --------------------------------------------------------
    # Windows Compliance Result
    # --------------------------------------------------------

    - name: "[WINDOWS] Calculate overall compliance"
      ansible.builtin.set_fact:
        compute_compliant: >-
          {{
            windows_firewall_compliant
            and windows_update_compliant
            and windows_nla_compliant
          }}

    - name: "[WINDOWS] Display compliance assessment"
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "WINDOWS SERVER COMPUTE COMPLIANCE"
          - "============================================"
          - "Host: {{ inventory_hostname }}"
          - "Platform: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - ""
          - "Host Firewall: {{ 'PASS' if windows_firewall_compliant else 'FAIL' }}"
          - "Update Readiness: {{ 'PASS' if windows_update_compliant else 'FAIL' }}"
          - "Secure Remote Access (NLA): {{ 'PASS' if windows_nla_compliant else 'FAIL' }}"
          - ""
          - "OVERALL: {{ 'COMPLIANT' if compute_compliant else 'NON-COMPLIANT' }}"
          - "============================================"