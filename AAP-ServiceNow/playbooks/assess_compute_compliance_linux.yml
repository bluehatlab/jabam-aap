---
# ============================================================
# RHEL + AMAZON LINUX COMPUTE COMPLIANCE ASSESSMENT
#
# Assessment only.
# This playbook detects drift but makes no changes.
# ============================================================

- name: Assess RHEL and Amazon Linux Compute Compliance
  hosts: rhel:amazon_linux
  become: true
  gather_facts: true

  tasks:

    # --------------------------------------------------------
    # Control 1 - Secure Remote Access
    # Root SSH login must be disabled
    # --------------------------------------------------------

    - name: "[LINUX] Check SSH root login policy"
      ansible.builtin.command:
        cmd: sshd -T
      register: sshd_config
      changed_when: false
      failed_when: false

    - name: "[LINUX] Evaluate SSH root login compliance"
      ansible.builtin.set_fact:
        ssh_root_compliant: >-
          {{
            'permitrootlogin no'
            in (sshd_config.stdout | lower)
          }}


    # --------------------------------------------------------
    # Gather service information
    # --------------------------------------------------------

    - name: "[LINUX] Gather service facts"
      ansible.builtin.service_facts:


    # --------------------------------------------------------
    # Control 2 - Host Firewall
    # firewalld must be running
    # --------------------------------------------------------

    - name: "[LINUX] Evaluate firewall compliance"
      ansible.builtin.set_fact:
        firewall_compliant: >-
          {{
            'firewalld.service' in ansible_facts.services
            and
            ansible_facts.services['firewalld.service'].state == 'running'
          }}


    # --------------------------------------------------------
    # Control 3 - Time Synchronization
    # chronyd must be running
    # --------------------------------------------------------

    - name: "[LINUX] Evaluate time synchronization compliance"
      ansible.builtin.set_fact:
        chrony_compliant: >-
          {{
            'chronyd.service' in ansible_facts.services
            and
            ansible_facts.services['chronyd.service'].state == 'running'
          }}


    # --------------------------------------------------------
    # Overall Compliance
    # --------------------------------------------------------

    - name: "[LINUX] Calculate overall compliance"
      ansible.builtin.set_fact:
        compute_compliant: >-
          {{
            ssh_root_compliant
            and firewall_compliant
            and chrony_compliant
          }}

    - name: "[LINUX] Display compliance assessment"
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "LINUX COMPUTE COMPLIANCE"
          - "============================================"
          - "Host: {{ inventory_hostname }}"
          - "Platform: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - ""
          - "CONTROL 1 - Secure Remote Access"
          - "SSH Root Login Disabled: {{ 'PASS' if ssh_root_compliant else 'FAIL' }}"
          - ""
          - "CONTROL 2 - Host Firewall"
          - "Firewall Running: {{ 'PASS' if firewall_compliant else 'FAIL' }}"
          - ""
          - "CONTROL 3 - Time Synchronization"
          - "Chrony Running: {{ 'PASS' if chrony_compliant else 'FAIL' }}"
          - ""
          - "OVERALL: {{ 'COMPLIANT' if compute_compliant else 'NON-COMPLIANT' }}"
          - "============================================"