---
# ============================================================
# RHEL + AMAZON LINUX COMPUTE COMPLIANCE ASSESSMENT
#
# Assessment only — no configuration changes.
# ============================================================

- name: Assess RHEL and Amazon Linux Compute Compliance
  hosts: rhel:amazon_linux
  become: true
  gather_facts: true

  tasks:

    # ========================================================
    # CONTROL 1 - SECURE REMOTE ACCESS
    # Required: Direct SSH root login disabled
    # ========================================================

    - name: "[LINUX] Read effective SSH configuration"
      ansible.builtin.command:
        cmd: sshd -T
      register: sshd_config
      changed_when: false
      failed_when: false

    - name: "[LINUX] Determine SSH root login setting"
      ansible.builtin.set_fact:
        ssh_root_setting: >-
          {{
            sshd_config.stdout_lines
            | select('match', '^permitrootlogin ')
            | first
            | default('not found')
          }}

    - name: "[LINUX] Evaluate SSH root login compliance"
      ansible.builtin.set_fact:
        ssh_root_compliant: >-
          {{
            ssh_root_setting == 'permitrootlogin no'
          }}


    # ========================================================
    # COLLECT SERVICE STATE
    # ========================================================

    - name: "[LINUX] Gather service facts"
      ansible.builtin.service_facts:


    # ========================================================
    # CONTROL 2 - HOST FIREWALL
    # Required: firewalld installed and running
    # ========================================================

    - name: "[LINUX] Determine firewall state"
      ansible.builtin.set_fact:
        firewall_state: >-
          {{
            ansible_facts.services['firewalld.service'].state
            if 'firewalld.service' in ansible_facts.services
            else 'not installed'
          }}

    - name: "[LINUX] Evaluate firewall compliance"
      ansible.builtin.set_fact:
        firewall_compliant: "{{ firewall_state == 'running' }}"


    # ========================================================
    # CONTROL 3 - TIME SYNCHRONIZATION
    # Required: chronyd running
    # ========================================================

    - name: "[LINUX] Determine Chrony state"
      ansible.builtin.set_fact:
        chrony_state: >-
          {{
            ansible_facts.services['chronyd.service'].state
            if 'chronyd.service' in ansible_facts.services
            else 'not installed'
          }}

    - name: "[LINUX] Evaluate time synchronization compliance"
      ansible.builtin.set_fact:
        chrony_compliant: "{{ chrony_state == 'running' }}"


    # ========================================================
    # OVERALL RESULT
    # ========================================================

    - name: "[LINUX] Calculate overall compliance"
      ansible.builtin.set_fact:
        compute_compliant: >-
          {{
            ssh_root_compliant
            and firewall_compliant
            and chrony_compliant
          }}

    - name: "[LINUX] Display compliance assessment"
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "LINUX COMPUTE COMPLIANCE"
          - "============================================"
          - "Host: {{ inventory_hostname }}"
          - "Platform: {{ ansible_distribution }}"
          - "Version: {{ ansible_distribution_version }}"
          - ""
          - "CONTROL 1 - Secure Remote Access"
          - "Required: permitrootlogin no"
          - "Observed: {{ ssh_root_setting }}"
          - "Result: {{ 'PASS' if ssh_root_compliant else 'FAIL' }}"
          - ""
          - "CONTROL 2 - Host Firewall"
          - "Required: firewalld running"
          - "Observed: {{ firewall_state }}"
          - "Result: {{ 'PASS' if firewall_compliant else 'FAIL' }}"
          - ""
          - "CONTROL 3 - Time Synchronization"
          - "Required: chronyd running"
          - "Observed: {{ chrony_state }}"
          - "Result: {{ 'PASS' if chrony_compliant else 'FAIL' }}"
          - ""
          - "OVERALL: {{ 'COMPLIANT' if compute_compliant else 'NON-COMPLIANT' }}"
          - "============================================"