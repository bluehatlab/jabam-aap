---
- name: RHEL Apache automatic remediation
  hosts: all

  sources:
    - ansible.eda.webhook:
        host: 0.0.0.0
        port: 5000

  rules:
    - name: Apache service failure detected
      condition: >-
        event.payload.service == "httpd" and
        event.payload.status == "down"

      action:
        run_workflow_template:
          name: "EDA - RHEL ServiceNow Remediation"
          organization: "JULIAN"