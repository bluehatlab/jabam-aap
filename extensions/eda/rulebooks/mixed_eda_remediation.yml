
---
- name: Monitor RHEL Apache HTTP availability
  hosts: all

  sources:
    - community.eda.url_check:
        urls:
          - http://3.80.122.153/
        delay: 15

  rules:
    - name: Report Apache UP
      condition: event.url_check.status == "up"
      action:
        debug:
          msg: "RHEL 10 | Apache | UP | 3.80.122.153"

    - name: Report Apache DOWN
      condition: event.url_check.status == "down"
      action:
        debug:
          msg: "RHEL 10 | Apache | DOWN | 3.80.122.153"

    - name: Remediate Apache outage
      condition: event.url_check.status == "down"
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.url_check.url
      action:
        run_workflow_template:
          name: "EDA RHEL ServiceNow Mixed Remediation (SN) - JULIAN"
          organization: "JULIAN"

- name: Monitor Windows IIS HTTP availability
  hosts: all

  sources:
    - community.eda.url_check:
        urls:
          - http://32.198.25.88/
        delay: 15

  rules:
    - name: Report Windows IIS UP
      condition: event.url_check.status == "up"
      action:
        debug:
          msg: "Windows Server 2022 | IIS | UP | 32.198.25.88"

    - name: Report Windows IIS DOWN
      condition: event.url_check.status == "down"
      action:
        debug:
          msg: "Windows Server 2022 | IIS | DOWN | 32.198.25.88"

    - name: Remediate Windows IIS outage
      condition: event.url_check.status == "down"
      throttle:
        once_within: 5 minutes
        group_by_attributes:
          - event.url_check.url
      action:
        run_workflow_template:
          name: "EDA RHEL ServiceNow Mixed Remediation (SN) - JULIAN"
          organization: "JULIAN"
