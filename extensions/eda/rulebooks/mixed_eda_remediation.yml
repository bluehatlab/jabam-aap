
---
- name: Monitor RHEL Apache and Windows IIS
  hosts: all

  sources:
    - community.eda.url_check:
        urls:
          - http://3.80.122.153/
          - http://32.198.25.88/
        delay: 15

  rules:
    - name: Apache UP
      condition: >-
        event.url_check.status == "up" and
        event.url_check.url == "http://3.80.122.153/"
      action:
        debug:
          msg: "RHEL 10 | Apache | UP"

    - name: Windows IIS UP
      condition: >-
        event.url_check.status == "up" and
        event.url_check.url == "http://32.198.25.88/"
      action:
        debug:
          msg: "Windows Server 2022 | IIS | UP"

    - name: Test outage detection
      condition: event.url_check.status == "down"
      action:
        debug:
          msg: "OUTAGE DETECTED | {{ event.url_check.url }} | DOWN"
